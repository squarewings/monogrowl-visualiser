<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monogrowl — Overflown Visualiser</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Space+Grotesk:wght@300;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080808;
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    cursor: crosshair;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 40px;
  }

  .track-info {
    opacity: 0.7;
    transition: opacity 0.5s;
  }

  .artist {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: 48px;
    color: #c8ff00;
    text-transform: uppercase;
    letter-spacing: 4px;
  }

  .track {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: 28px;
    color: #e8e8e8;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.6;
  }

  .play-prompt {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    text-align: center;
    cursor: pointer;
    pointer-events: all;
  }

  .play-prompt .circle {
    width: 120px;
    height: 120px;
    border: 3px solid #c8ff00;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    transition: all 0.3s;
  }

  .play-prompt .circle:hover {
    background: rgba(200, 255, 0, 0.1);
    transform: scale(1.05);
  }

  .play-prompt .triangle {
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 20px 0 20px 36px;
    border-color: transparent transparent transparent #c8ff00;
    margin-left: 8px;
  }

  .play-prompt .label {
    font-size: 14px;
    color: #888;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .play-prompt.hidden { display: none; }

  .mode-indicator {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 20;
    font-size: 12px;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .record-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 30;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  .record-btn:hover { border-color: rgba(255,255,255,0.6); }
  .record-btn .dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ff3333;
    transition: all 0.3s;
  }
  .record-btn.recording { border-color: #ff3333; }
  .record-btn.recording .dot {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background: #ff3333;
  }

  .record-timer {
    position: fixed;
    bottom: 95px;
    right: 30px;
    z-index: 30;
    color: #ff3333;
    font-size: 14px;
    font-family: monospace;
    letter-spacing: 1px;
    text-align: center;
    width: 56px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .record-timer.visible { opacity: 1; }

  .share-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }
  .share-overlay.active { display: flex; }
  .share-overlay video {
    max-width: 80%;
    max-height: 50vh;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .share-overlay .share-actions {
    display: flex;
    gap: 15px;
  }
  .share-overlay button {
    padding: 12px 24px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .share-overlay button:hover { background: rgba(255,255,255,0.2); }
  .share-overlay button.primary { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); border: none; }
  .share-overlay .close-share {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    color: #888;
    font-size: 24px;
    cursor: pointer;
    padding: 10px;
  }
</style>
</head>
<body>

<canvas id="viz" style="display:none;"></canvas>
<canvas id="gl" style="position:fixed;top:0;left:0;"></canvas>

<!-- Record UI removed — use server-side rendering for share videos -->
<div class="share-overlay" id="shareOverlay" style="display:none;"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

<div class="overlay">
  <div class="track-info">
    <div class="artist">Monogrowl</div>
    <div class="track">Overflown</div>
  </div>
</div>

<div class="play-prompt" id="playPrompt">
  <div class="circle">
    <div class="triangle"></div>
  </div>
  <div class="label">Tap to play</div>
</div>

<div class="mode-indicator" id="modeLabel">wireframe city</div>

<script>
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Audio setup
let audioCtx, analyser, source, dataArray, freqArray, audio;
let isPlaying = false;
var mode = 0;
const modes = ['wireframe city', 'waveform', 'bars', 'circles', 'particles', 'terrain', '3d sphere'];
var demoMode = window.location.search.includes('demo');

// Init arrays immediately for demo mode
dataArray = new Uint8Array(1024);
freqArray = new Uint8Array(1024);

function generateDemoData() {
  const t = time;
  for (let i = 0; i < freqArray.length; i++) {
    const bassWeight = Math.max(0, 1 - i / 30);
    const midWeight = (i > 20 && i < 200) ? 0.6 : 0;
    const highWeight = (i > 200 && i < 500) ? 0.3 : 0;
    const beat = Math.sin(t * 0.08) * 0.5 + 0.5;
    const kick = Math.pow(Math.max(0, Math.sin(t * 0.06)), 8) * 0.9;
    const subBeat = Math.sin(t * 0.04 + i * 0.03) * 0.3 + 0.5;

    freqArray[i] = Math.min(255, Math.max(0,
      bassWeight * (beat * 230 + kick * 220) +
      midWeight * subBeat * 180 +
      highWeight * Math.sin(t * 0.12 + i * 0.08) * 120 +
      Math.random() * 15 +
      Math.sin(t * 0.05 + i * 0.02) * 40
    ));
  }
  for (let i = 0; i < dataArray.length; i++) {
    dataArray[i] = 128 +
      Math.sin(t * 0.06 + i * 0.015) * 80 * (Math.sin(t * 0.08) * 0.5 + 0.5) +
      Math.sin(t * 0.03 + i * 0.06) * 30 +
      Math.random() * 8;
  }
}

// Particle system
const particles = [];
const MAX_PARTICLES = 200;

class Particle {
  constructor(x, y, energy) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * energy * 4;
    this.vy = (Math.random() - 0.5) * energy * 4;
    this.life = 1;
    this.decay = 0.005 + Math.random() * 0.02;
    this.size = 2 + Math.random() * energy * 8;
    this.hue = 65 + Math.random() * 20;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.life -= this.decay;
  }
  draw() {
    const r = Math.max(0, this.size * this.life);
    if (r < 0.1) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${Math.max(0, this.life) * 0.6})`;
    ctx.fill();
  }
}

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.88;

  audio = new Audio('overflown.mp3');
  audio.crossOrigin = 'anonymous';
  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  dataArray = new Uint8Array(analyser.frequencyBinCount);
  freqArray = new Uint8Array(analyser.frequencyBinCount);
}

function play() {
  if (!audioCtx) initAudio();
  audio.play();
  isPlaying = true;
  document.getElementById('playPrompt').classList.add('hidden');
}

function startVisualiser() {
  if (!audioCtx) initAudio();
  audio.play().then(() => {
    // Real audio is playing — analyser is connected
    isPlaying = true;
    document.getElementById('playPrompt').classList.add('hidden');
  }).catch(() => {
    // No audio file available (hosted version) — fall back to demo
    window._demoFallback = true;
    isPlaying = true;
    document.getElementById('playPrompt').classList.add('hidden');
  });
}

// Play button — click and touch
const playBtn = document.getElementById('playPrompt');
playBtn.addEventListener('click', startVisualiser);
playBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  startVisualiser();
});

// Touch to cycle modes on mobile (only after play prompt is hidden)
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  // Don't interfere with play button
  if (e.target.closest('#playPrompt')) return;
  if (!document.getElementById('playPrompt').classList.contains('hidden')) return;

  const now = Date.now();
  if (now - lastTap < 300) return; // debounce
  lastTap = now;

  mode = (mode + 1) % modes.length;
  document.getElementById('modeLabel').textContent = modes[mode];
  updateCanvasVisibility();
});

// Mode switching handled after Three.js init below

// Get energy from frequency bands
function getBassEnergy() {
  let sum = 0;
  for (let i = 0; i < 10; i++) sum += freqArray[i];
  return sum / (10 * 255);
}

function getMidEnergy() {
  let sum = 0;
  for (let i = 10; i < 100; i++) sum += freqArray[i];
  return sum / (90 * 255);
}

function getHighEnergy() {
  let sum = 0;
  for (let i = 100; i < 400; i++) sum += freqArray[i];
  return sum / (300 * 255);
}

let time = 0;

if (demoMode) {
  document.getElementById('playPrompt').classList.add('hidden');
}

function drawWaveform() {
  if (analyser && !demoMode) analyser.getByteTimeDomainData(dataArray);
  const bass = getBassEnergy();

  // Background pulse
  ctx.fillStyle = `rgba(8, 8, 8, ${0.15 - bass * 0.05})`;
  ctx.fillRect(0, 0, W, H);

  // Main waveform
  ctx.lineWidth = 2 + bass * 4;
  ctx.strokeStyle = `rgba(200, 255, 0, ${0.4 + bass * 0.4})`;
  ctx.beginPath();
  const sliceWidth = W / dataArray.length;
  let x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = dataArray[i] / 128.0;
    const y = v * H / 2;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceWidth;
  }
  ctx.stroke();

  // Mirror waveform
  ctx.strokeStyle = `rgba(200, 255, 0, ${0.1 + bass * 0.15})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = dataArray[i] / 128.0;
    const y = H - (v * H / 2);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceWidth;
  }
  ctx.stroke();
}

function drawBars() {
  const bass = getBassEnergy();

  ctx.fillStyle = `rgba(8, 8, 8, 0.2)`;
  ctx.fillRect(0, 0, W, H);

  const barCount = 64;
  const barWidth = W / barCount;
  const step = Math.floor(freqArray.length / barCount);

  for (let i = 0; i < barCount; i++) {
    const val = freqArray[i * step] / 255;
    const barHeight = val * H * 0.8;

    const hue = 65 + (i / barCount) * 30;
    const lightness = 40 + val * 30;

    // Main bar
    ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${0.7 + val * 0.3})`;
    ctx.fillRect(i * barWidth + 1, H - barHeight, barWidth - 2, barHeight);

    // Reflection
    ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${0.1 + val * 0.1})`;
    ctx.fillRect(i * barWidth + 1, H, barWidth - 2, -barHeight * 0.3);

    // Glow on bass hits
    if (bass > 0.5 && i < 10) {
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#c8ff00';
      ctx.fillRect(i * barWidth + 1, H - barHeight, barWidth - 2, barHeight);
      ctx.shadowBlur = 0;
    }
  }
}

function drawCircles() {
  const bass = getBassEnergy();
  const mid = getMidEnergy();
  const high = getHighEnergy();

  ctx.fillStyle = `rgba(8, 8, 8, 0.08)`;
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;
  const rings = 5;

  for (let r = 0; r < rings; r++) {
    const baseRadius = 50 + r * 60;
    const points = 128;
    const energy = r < 2 ? bass : (r < 4 ? mid : high);

    ctx.beginPath();
    for (let i = 0; i <= points; i++) {
      const angle = (i / points) * Math.PI * 2;
      const freqIdx = Math.floor((i / points) * freqArray.length * 0.5);
      const amp = freqArray[freqIdx] / 255;
      const radius = baseRadius + amp * (40 + r * 20) + Math.sin(time * 0.02 + r) * 10;

      const x = cx + Math.cos(angle + time * 0.005 * (r + 1)) * radius;
      const y = cy + Math.sin(angle + time * 0.005 * (r + 1)) * radius;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const alpha = 0.3 + energy * 0.5;
    const hue = 65 + r * 15;
    ctx.strokeStyle = `hsla(${hue}, 100%, ${50 + energy * 30}%, ${alpha})`;
    ctx.lineWidth = 1.5 + energy * 2;
    ctx.stroke();
  }

  // Centre pulse
  const pulseR = 20 + bass * 80;
  const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulseR);
  gradient.addColorStop(0, `rgba(200, 255, 0, ${0.3 + bass * 0.4})`);
  gradient.addColorStop(1, 'rgba(200, 255, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(cx, cy, pulseR, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticles() {
  const bass = getBassEnergy();
  const mid = getMidEnergy();

  ctx.fillStyle = `rgba(8, 8, 8, 0.1)`;
  ctx.fillRect(0, 0, W, H);

  // Spawn particles on beats
  if (bass > 0.4 && particles.length < MAX_PARTICLES) {
    const count = Math.floor(bass * 15);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(
        W / 2 + (Math.random() - 0.5) * 200,
        H / 2 + (Math.random() - 0.5) * 200,
        bass
      ));
    }
  }

  // Spawn mid-frequency particles from edges
  if (mid > 0.3 && particles.length < MAX_PARTICLES) {
    const count = Math.floor(mid * 5);
    for (let i = 0; i < count; i++) {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = 0; y = Math.random() * H; }
      else if (side === 1) { x = W; y = Math.random() * H; }
      else if (side === 2) { x = Math.random() * W; y = 0; }
      else { x = Math.random() * W; y = H; }
      particles.push(new Particle(x, y, mid * 0.5));
    }
  }

  // Update and draw
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Connecting lines between nearby particles (batched into single path)
  ctx.strokeStyle = `rgba(200, 255, 0, 0.05)`;
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  const pLen = Math.min(particles.length, 150); // limit connection checks
  for (let i = 0; i < pLen; i++) {
    for (let j = i + 1; j < pLen; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      if (dx * dx + dy * dy < 10000) { // 100² — skip sqrt
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
      }
    }
  }
  ctx.stroke();
}

function drawTerrain() {
  const bass = getBassEnergy();
  const mid = getMidEnergy();

  ctx.fillStyle = `rgba(8, 8, 8, 0.3)`;
  ctx.fillRect(0, 0, W, H);

  const rows = 20;
  const cols = 80; // fixed column count for consistent performance
  const step = Math.max(1, Math.floor(freqArray.length / cols));

  for (let r = 0; r < rows; r++) {
    const y0 = H * 0.3 + r * (H * 0.5 / rows);
    const perspective = (r + 1) / rows;

    ctx.beginPath();
    for (let c = 0; c < cols; c++) {
      const x = (c / cols) * W;
      // Average nearby bins for smoother terrain
      const idx = c * step;
      let sum = 0;
      for (let k = 0; k < step && idx + k < freqArray.length; k++) sum += freqArray[idx + k];
      const freqVal = (sum / step) / 255;
      const elevation = freqVal * 100 * perspective;
      const y = y0 - elevation + Math.sin(time * 0.03 + c * 0.1) * 5 * perspective;

      if (c === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    const alpha = 0.1 + perspective * 0.5;
    const hue = 65 + (1 - perspective) * 40;
    ctx.strokeStyle = `hsla(${hue}, 100%, ${40 + perspective * 30}%, ${alpha})`;
    ctx.lineWidth = 0.5 + perspective * 2;
    ctx.stroke();
  }

  // Horizon glow
  const glow = ctx.createLinearGradient(0, H * 0.25, 0, H * 0.4);
  glow.addColorStop(0, `rgba(200, 255, 0, ${bass * 0.15})`);
  glow.addColorStop(1, 'rgba(200, 255, 0, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, H * 0.25, W, H * 0.15);
}

// === WIREFRAME CITY MODE (Escape from New York) ===
const glCanvas = document.getElementById('gl');

let renderer; // shared WebGL renderer for all 3D modes
let cityScene, cityCamera, cityComposer, cityInitialized = false;
let cityReactiveInstances, cityReactiveDummy, cityReactiveCount;
let cityPath, cityPathT = 0;
let smoothCityBass = 0, smoothCityMid = 0, smoothCityHigh = 0;
const CITY_SMOOTH = 0.18;

// Custom shader: Scanlines
const ScanlineShader = {
  uniforms: { tDiffuse: { value: null }, intensity: { value: 0.12 }, count: { value: 400.0 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float intensity; uniform float count;
    varying vec2 vUv;
    void main() {
      vec4 color = texture2D(tDiffuse, vUv);
      float scanline = sin(vUv.y * count * 3.14159) * 0.5 + 0.5;
      color.rgb -= scanline * intensity;
      gl_FragColor = color;
    }`
};

// Custom shader: Chromatic aberration
const ChromaticShader = {
  uniforms: { tDiffuse: { value: null }, amount: { value: 0.003 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float amount;
    varying vec2 vUv;
    void main() {
      float r = texture2D(tDiffuse, vUv + vec2(amount, 0.0)).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv - vec2(amount, 0.0)).b;
      float a = texture2D(tDiffuse, vUv).a;
      gl_FragColor = vec4(r, g, b, a);
    }`
};

// Custom shader: Vignette
const VignetteShader = {
  uniforms: { tDiffuse: { value: null }, darkness: { value: 1.2 }, offset: { value: 1.0 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float darkness; uniform float offset;
    varying vec2 vUv;
    void main() {
      vec4 color = texture2D(tDiffuse, vUv);
      vec2 uv = (vUv - 0.5) * 2.0;
      float vig = clamp(1.0 - dot(uv, uv) * darkness + offset, 0.0, 1.0);
      color.rgb *= vig;
      gl_FragColor = color;
    }`
};

function initCity() {
  if (cityInitialized) return;
  cityInitialized = true;

  cityScene = new THREE.Scene();
  cityScene.background = new THREE.Color(0x000000);
  cityScene.fog = new THREE.FogExp2(0x001a00, 0.0018);

  cityCamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 600);

  // --- Procedural city generation ---
  const gridSize = 40;
  const blockSize = 8;
  const streetWidth = 3;
  const cellSize = blockSize + streetWidth;
  const halfGrid = (gridSize * cellSize) / 2;

  // Static wireframe buildings — merged into one geometry
  const edgesGeos = [];
  const greenMat = new THREE.LineBasicMaterial({ color: 0x33ff33, transparent: true, opacity: 0.7 });

  for (let gx = 0; gx < gridSize; gx++) {
    for (let gz = 0; gz < gridSize; gz++) {
      // Manhattan-like height distribution: taller in centre
      const cx = (gx - gridSize / 2) / (gridSize / 2);
      const cz = (gz - gridSize / 2) / (gridSize / 2);
      const distFromCentre = Math.sqrt(cx * cx + cz * cz);
      const heightBias = Math.max(0, 1 - distFromCentre) * 40;

      // Skip some cells for variety (parks/plazas)
      const hash = Math.sin(gx * 127.1 + gz * 311.7) * 43758.5453;
      const skip = (hash - Math.floor(hash));
      if (skip < 0.55) continue;

      // Wide height variation: some low, some towering
      const roll = Math.random();
      const baseH = roll < 0.3 ? 1 + Math.random() * 4 : roll < 0.7 ? 5 + Math.random() * 18 : 20 + Math.random() * 35;
      const h = baseH + heightBias * Math.random() * 1.5;
      const w = blockSize * (0.5 + Math.random() * 0.5);
      const d = blockSize * (0.5 + Math.random() * 0.5);

      const box = new THREE.BoxGeometry(w, h, d);
      box.translate(
        gx * cellSize - halfGrid + cellSize / 2,
        h / 2,
        gz * cellSize - halfGrid + cellSize / 2
      );
      edgesGeos.push(new THREE.EdgesGeometry(box));
      box.dispose();
    }
  }

  // Merge all edges into one BufferGeometry
  const mergedPositions = [];
  for (const eg of edgesGeos) {
    const pos = eg.attributes.position.array;
    for (let i = 0; i < pos.length; i++) mergedPositions.push(pos[i]);
    eg.dispose();
  }
  const mergedGeo = new THREE.BufferGeometry();
  mergedGeo.setAttribute('position', new THREE.Float32BufferAttribute(mergedPositions, 3));
  const cityWireframe = new THREE.LineSegments(mergedGeo, greenMat);
  cityScene.add(cityWireframe);

  // Ground grid
  const groundGeo = new THREE.BufferGeometry();
  const groundVerts = [];
  const gridExtent = halfGrid + 20;
  const gridStep = cellSize;
  for (let i = -gridExtent; i <= gridExtent; i += gridStep) {
    groundVerts.push(-gridExtent, 0, i, gridExtent, 0, i);
    groundVerts.push(i, 0, -gridExtent, i, 0, gridExtent);
  }
  groundGeo.setAttribute('position', new THREE.Float32BufferAttribute(groundVerts, 3));
  const groundMat = new THREE.LineBasicMaterial({ color: 0x1a5c1a, transparent: true, opacity: 0.3 });
  cityScene.add(new THREE.LineSegments(groundGeo, groundMat));

  // --- Audio-reactive instanced buildings ---
  cityReactiveCount = 100;
  const reactiveGeo = new THREE.BoxGeometry(1, 1, 1);
  const reactiveEdges = new THREE.EdgesGeometry(reactiveGeo);
  const reactiveMat = new THREE.LineBasicMaterial({ color: 0x66ff66, transparent: true, opacity: 0.9 });
  cityReactiveInstances = new THREE.InstancedMesh(
    reactiveEdges, reactiveMat, cityReactiveCount
  );
  // Workaround: InstancedMesh with LineSegments doesn't work directly.
  // Instead, we'll store reactive building data and update line positions.
  // Actually, let's use individual meshes in a group for simplicity and correctness.
  cityScene.remove(cityReactiveInstances);

  // Use a group of individual wireframe boxes for reactive buildings
  cityReactiveInstances = new THREE.Group();
  const reactiveData = [];
  for (let i = 0; i < cityReactiveCount; i++) {
    const gx = Math.floor(Math.random() * gridSize);
    const gz = Math.floor(Math.random() * gridSize);
    const x = gx * cellSize - halfGrid + cellSize / 2;
    const z = gz * cellSize - halfGrid + cellSize / 2;
    const baseH = 5 + Math.random() * 20;
    const w = blockSize * (0.3 + Math.random() * 0.4);
    const d = blockSize * (0.3 + Math.random() * 0.4);

    const rBox = new THREE.BoxGeometry(w, 1, d);
    const rEdges = new THREE.EdgesGeometry(rBox);
    const rLine = new THREE.LineSegments(rEdges, new THREE.LineBasicMaterial({
      color: 0x55ff55, transparent: true, opacity: 0.85
    }));
    rLine.position.set(x, 0, z);
    rLine.scale.set(1, baseH, 1);
    rLine.position.y = baseH / 2;
    cityReactiveInstances.add(rLine);
    reactiveData.push({ mesh: rLine, baseH, x, z, freqBin: i });
    rBox.dispose();
  }
  cityScene.add(cityReactiveInstances);
  cityReactiveInstances.userData.data = reactiveData;

  // --- Camera flyover path ---
  const pathPoints = [
    new THREE.Vector3(-halfGrid * 0.8, 55, -halfGrid * 0.8),
    new THREE.Vector3(-halfGrid * 0.3, 40, -halfGrid * 0.4),
    new THREE.Vector3(0, 60, -halfGrid * 0.2),
    new THREE.Vector3(halfGrid * 0.2, 35, 0),
    new THREE.Vector3(halfGrid * 0.4, 50, halfGrid * 0.3),
    new THREE.Vector3(0, 65, halfGrid * 0.5),
    new THREE.Vector3(-halfGrid * 0.4, 45, halfGrid * 0.3),
    new THREE.Vector3(-halfGrid * 0.6, 55, 0),
  ];
  cityPath = new THREE.CatmullRomCurve3(pathPoints, true); // closed loop

  // --- Speed particles (velocity streaks) ---
  const particleCount = 500;
  const pGeo = new THREE.BufferGeometry();
  const pPositions = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount; i++) {
    pPositions[i * 3] = (Math.random() - 0.5) * 200;
    pPositions[i * 3 + 1] = Math.random() * 60;
    pPositions[i * 3 + 2] = (Math.random() - 0.5) * 200;
  }
  pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
  const pMat = new THREE.PointsMaterial({ color: 0x33ff33, size: 0.5, transparent: true, opacity: 0.4 });
  const speedParticles = new THREE.Points(pGeo, pMat);
  cityScene.add(speedParticles);
  cityScene.userData.speedParticles = speedParticles;

  // --- Post-processing ---
  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  }

  cityComposer = new THREE.EffectComposer(renderer);
  cityComposer.addPass(new THREE.RenderPass(cityScene, cityCamera));

  const bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.7, 0.3, 0.4
  );
  cityComposer.addPass(bloomPass);

  const scanlinePass = new THREE.ShaderPass(ScanlineShader);
  cityComposer.addPass(scanlinePass);

  const chromaPass = new THREE.ShaderPass(ChromaticShader);
  cityComposer.addPass(chromaPass);

  const vignettePass = new THREE.ShaderPass(VignetteShader);
  cityComposer.addPass(vignettePass);

  cityScene.userData.bloomPass = bloomPass;

  window.addEventListener('resize', () => {
    if (!cityCamera || !cityComposer) return;
    cityCamera.aspect = window.innerWidth / window.innerHeight;
    cityCamera.updateProjectionMatrix();
    cityComposer.setSize(window.innerWidth, window.innerHeight);
  });
}

function drawWireframeCity() {
  if (!cityInitialized) initCity();

  const bass = getBassEnergy();
  const mid = getMidEnergy();
  const high = getHighEnergy();

  smoothCityBass += (bass - smoothCityBass) * CITY_SMOOTH;
  smoothCityMid += (mid - smoothCityMid) * CITY_SMOOTH;
  smoothCityHigh += (high - smoothCityHigh) * CITY_SMOOTH;

  // --- Animate reactive buildings ---
  const data = cityReactiveInstances.userData.data;
  const binStep = Math.max(1, Math.floor(freqArray.length / cityReactiveCount));
  for (let i = 0; i < data.length; i++) {
    const d = data[i];
    const freqIdx = Math.min(i * binStep, freqArray.length - 1);
    const freqVal = freqArray[freqIdx] / 255;
    const targetH = d.baseH + freqVal * 40 + smoothCityBass * 15;
    const currentH = d.mesh.scale.y;
    d.mesh.scale.y += (targetH - currentH) * 0.15;
    d.mesh.position.y = d.mesh.scale.y / 2;
  }

  // --- Camera flyover ---
  const speed = 0.0004 + smoothCityBass * 0.0002;
  cityPathT = (cityPathT + speed) % 1;
  const camPos = cityPath.getPointAt(cityPathT);
  const lookAhead = cityPath.getPointAt((cityPathT + 0.02) % 1);

  // Very subtle camera shake on heavy bass only
  const shake = Math.max(0, smoothCityBass - 0.5) * 0.3;
  camPos.x += (Math.random() - 0.5) * shake;
  camPos.y += (Math.random() - 0.5) * shake * 0.3;

  cityCamera.position.copy(camPos);
  cityCamera.lookAt(lookAhead);

  // --- Speed particles follow camera ---
  const sp = cityScene.userData.speedParticles;
  if (sp) {
    sp.position.x = camPos.x;
    sp.position.z = camPos.z;
    sp.rotation.y += 0.001;
  }

  // --- Modulate bloom with energy ---
  const bloomPass = cityScene.userData.bloomPass;
  if (bloomPass) {
    bloomPass.strength = 0.6 + smoothCityHigh * 0.4;
  }

  // --- Render with post-processing ---
  renderer.setClearColor(0x000000);
  cityComposer.render();
}

// === THREE.JS 3D SPHERE MODE ===
// renderer is shared with city mode (declared above in city init)
let scene, camera, sphereMesh, sphereGeo, glowMesh, ringMeshes, starField;
let glInitialized = false;

// Simplex noise for GPU displacement (Ashima Arts)
const simplexNoiseGLSL = `
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
`;

const sphereVertexShader = `
${simplexNoiseGLSL}

uniform float uTime;
uniform float uAudioLevel;
uniform float uBass;

varying vec3 vNormal;
varying vec3 vPosition;

void main() {
  vNormal = normalize(normalMatrix * normal);

  // Noise sampled in LOCAL space (position, not world) — rotation won't cause jitter
  // Only time drives the noise evolution, creating slow organic morphing
  vec3 noiseCoord = normalize(position) * 1.2;
  float noise1 = snoise(noiseCoord + vec3(uTime * 0.06, 0.0, 0.0)) * 0.5;
  float noise2 = snoise(noiseCoord * 1.5 + vec3(0.0, uTime * 0.04, 0.0)) * 0.3;
  float noise = noise1 + noise2;

  // Breathing base animation (alive even during silence)
  float breathing = sin(uTime * 0.4) * 0.04 + sin(uTime * 0.7) * 0.03;

  // Audio-reactive displacement — moderate depth, keeps sphere recognisable
  float displacement = breathing + noise * (0.06 + uAudioLevel * 0.35 + uBass * 0.25);

  vec3 newPos = position + normal * displacement * length(position);
  vPosition = newPos;

  gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
}
`;

const sphereFragmentShader = `
uniform float uAudioLevel;
uniform float uBass;
uniform float uTime;

varying vec3 vNormal;
varying vec3 vPosition;

void main() {
  // Fresnel glow — edges glow brighter
  vec3 viewDir = normalize(cameraPosition - vPosition);
  float fresnel = 1.0 - abs(dot(viewDir, vNormal));
  fresnel = pow(fresnel, 2.0);

  // Base colour (Monogrowl green-gold)
  vec3 baseColor = vec3(0.78, 1.0, 0.0);
  vec3 glowColor = vec3(1.0, 1.0, 0.6);

  vec3 color = mix(baseColor, glowColor, fresnel * 0.6 + uBass * 0.3);

  // Inverse opacity — more ethereal on loud moments
  float alpha = 0.5 + fresnel * 0.4 - uAudioLevel * 0.15;
  alpha = clamp(alpha, 0.15, 0.9);

  gl_FragColor = vec4(color, alpha);
}
`;

const glowFragmentShader = `
uniform float uAudioLevel;
uniform float uBass;
uniform float uTime;

varying vec3 vNormal;
varying vec3 vPosition;

void main() {
  vec3 viewDir = normalize(cameraPosition - vPosition);
  float fresnel = 1.0 - abs(dot(viewDir, vNormal));
  fresnel = pow(fresnel, 3.0);

  vec3 color = vec3(0.78, 1.0, 0.0);
  float pulse = sin(uTime * 0.6) * 0.1 + 0.9;
  float alpha = fresnel * (0.15 + uBass * 0.35) * pulse;

  gl_FragColor = vec4(color, alpha);
}
`;

function initThreeJS() {
  if (glInitialized) return;
  glInitialized = true;

  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  }
  renderer.setClearColor(0x080808);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x080808, 0.0015);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 350);

  // Outer wireframe sphere — GPU-displaced via shader
  sphereGeo = new THREE.IcosahedronGeometry(80, 5);
  const sphereMat = new THREE.ShaderMaterial({
    vertexShader: sphereVertexShader,
    fragmentShader: sphereFragmentShader,
    uniforms: {
      uTime: { value: 0 },
      uAudioLevel: { value: 0 },
      uBass: { value: 0 }
    },
    wireframe: true,
    transparent: true,
    depthWrite: false
  });
  sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
  scene.add(sphereMesh);

  // Inner glow sphere — BackSide, additive blending
  const glowGeo = new THREE.IcosahedronGeometry(78, 4);
  const glowMat = new THREE.ShaderMaterial({
    vertexShader: sphereVertexShader,
    fragmentShader: glowFragmentShader,
    uniforms: {
      uTime: { value: 0 },
      uAudioLevel: { value: 0 },
      uBass: { value: 0 }
    },
    transparent: true,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  glowMesh = new THREE.Mesh(glowGeo, glowMat);
  scene.add(glowMesh);

  // Orbiting rings
  ringMeshes = [];
  for (let i = 0; i < 4; i++) {
    const ringGeo = new THREE.TorusGeometry(120 + i * 40, 1 + i * 0.3, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(0.18 + i * 0.02, 1, 0.5),
      transparent: true,
      opacity: 0.3
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2 + i * 0.3;
    ring.rotation.y = i * 0.5;
    scene.add(ring);
    ringMeshes.push(ring);
  }

  // Star field
  const starGeo = new THREE.BufferGeometry();
  const starPositions = [];
  const starColors = [];
  for (let i = 0; i < 2000; i++) {
    starPositions.push(
      (Math.random() - 0.5) * 2000,
      (Math.random() - 0.5) * 2000,
      (Math.random() - 0.5) * 2000
    );
    const c = new THREE.Color().setHSL(0.18, Math.random(), 0.3 + Math.random() * 0.4);
    starColors.push(c.r, c.g, c.b);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
  starGeo.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
  const starMat = new THREE.PointsMaterial({ size: 2, vertexColors: true, transparent: true, opacity: 0.6 });
  starField = new THREE.Points(starGeo, starMat);
  scene.add(starField);

  // Ambient light
  scene.add(new THREE.AmbientLight(0xc8ff00, 0.3));

  window.addEventListener('resize', () => {
    if (!renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// Smoothed values for 3D mode — lerp toward target to eliminate jitter
let smoothBass3D = 0, smoothMid3D = 0, smoothAudio3D = 0;
const SMOOTH_FACTOR = 0.2; // lower = smoother, higher = more reactive

function draw3DSphere() {
  if (!glInitialized) initThreeJS();

  const bass = getBassEnergy();
  const mid = getMidEnergy();
  const high = getHighEnergy();
  const audioLevel = (bass + mid + high) / 3;
  const t = time * 0.016;

  // Smooth all audio values to eliminate frame-to-frame jitter
  smoothBass3D += (bass - smoothBass3D) * SMOOTH_FACTOR;
  smoothMid3D += (mid - smoothMid3D) * SMOOTH_FACTOR;
  smoothAudio3D += (audioLevel - smoothAudio3D) * SMOOTH_FACTOR;

  // Update shader uniforms — all displacement happens on GPU
  const sphereUniforms = sphereMesh.material.uniforms;
  sphereUniforms.uTime.value = t;
  sphereUniforms.uAudioLevel.value = smoothAudio3D;
  sphereUniforms.uBass.value = smoothBass3D;

  const glowUniforms = glowMesh.material.uniforms;
  glowUniforms.uTime.value = t;
  glowUniforms.uAudioLevel.value = smoothAudio3D;
  glowUniforms.uBass.value = smoothBass3D;

  // Rotate sphere and glow together
  const rotY = 0.003 + smoothBass3D * 0.02;
  const rotX = 0.001 + smoothMid3D * 0.01;
  sphereMesh.rotation.y += rotY;
  sphereMesh.rotation.x += rotX;
  glowMesh.rotation.y += rotY;
  glowMesh.rotation.x += rotX;

  // Animate rings
  ringMeshes.forEach((ring, i) => {
    const energy = i < 2 ? smoothBass3D : smoothMid3D;
    ring.rotation.z += (0.005 + energy * 0.03) * (i % 2 === 0 ? 1 : -1);
    ring.rotation.x += 0.002 * (i + 1);
    ring.scale.setScalar(1 + energy * 0.3);
    ring.material.opacity = 0.15 + energy * 0.4;
  });

  // Rotate star field
  starField.rotation.y += 0.0003;
  starField.rotation.x += 0.0001;
  starField.material.opacity = 0.4 + smoothBass3D * 0.3;

  // Camera orbit
  camera.position.x = Math.sin(time * 0.003) * 300;
  camera.position.z = Math.cos(time * 0.003) * 300;
  camera.position.y = Math.sin(time * 0.005) * 80;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

// Mode switching - show/hide canvases
function updateCanvasVisibility() {
  if (mode === 0 || mode === 6) {
    canvas.style.display = 'none';
    glCanvas.style.display = 'block';
    if (mode === 0) initCity();
    if (mode === 6) initThreeJS();
  } else {
    canvas.style.display = 'block';
    glCanvas.style.display = 'none';
  }
}

function animate() {
  try {
    if (demoMode || window._demoFallback) {
      generateDemoData();
      isPlaying = true;
    } else if (isPlaying && analyser) {
      analyser.getByteFrequencyData(freqArray);
    }

    switch (mode) {
      case 0: drawWireframeCity(); break;
      case 1: drawWaveform(); break;
      case 2: drawBars(); break;
      case 3: drawCircles(); break;
      case 4: drawParticles(); break;
      case 5: drawTerrain(); break;
      case 6: draw3DSphere(); break;
    }
  } catch (e) {
    // Recover from draw errors — clear dead particles and continue
    particles.length = 0;
  }

  time++;
  requestAnimationFrame(animate);
}

    compCtx.letterSpacing = `${4 * scale}px`;
    compCtx.textBaseline = 'bottom';
    compCtx.fillText('MONOGROWL', pad, h - pad - 32 * scale);

    // "Overflown" — track
    compCtx.font = `900 ${28 * scale}px 'Big Shoulders Display', sans-serif`;
    compCtx.fillStyle = 'rgba(232, 232, 232, 0.42)';
    compCtx.letterSpacing = `${2 * scale}px`;
    compCtx.fillText('OVERFLOWN', pad, h - pad);

    // Mode label — top right
    compCtx.font = `${12 * scale}px sans-serif`;
    compCtx.fillStyle = 'rgba(85, 85, 85, 1)';
    compCtx.textBaseline = 'top';
    compCtx.textAlign = 'right';
    compCtx.fillText(modes[mode].toUpperCase(), w - 20 * scale, 20 * scale);
    compCtx.textAlign = 'left';

    compAnimFrame = requestAnimationFrame(drawCompFrame);
  }

  function startRecording() {
    initCompCanvas();

    const stream = compCanvas.captureStream(30);

    // Mix in audio if playing
    if (audioCtx && isPlaying && !demoMode) {
      try {
        const dest = audioCtx.createMediaStreamDestination();
        analyser.connect(dest);
        for (const track of dest.stream.getAudioTracks()) {
          stream.addTrack(track);
        }
      } catch(e) { /* audio capture optional */ }
    }

    // Prefer MP4 for iOS compatibility, fall back to WebM
    const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4'
      : MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
      : 'video/webm';

    chunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 5000000 });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = onRecordingComplete;

    mediaRecorder.start(100);
    recording = true;
    startTime = Date.now();
    recordBtn.classList.add('recording');
    timerEl.classList.add('visible');

    // Start compositing frames
    drawCompFrame();

    timerInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const secs = Math.floor(elapsed / 1000);
      timerEl.textContent = `0:${secs.toString().padStart(2, '0')}`;
      if (elapsed >= MAX_DURATION) stopRecording();
    }, 250);
  }

  function stopRecording() {
    if (!mediaRecorder || !recording) return;
    mediaRecorder.stop();
    recording = false;
    recordBtn.classList.remove('recording');
    timerEl.classList.remove('visible');
    clearInterval(timerInterval);
    if (compAnimFrame) cancelAnimationFrame(compAnimFrame);
  }

  function onRecordingComplete() {
    const mimeType = mediaRecorder.mimeType;
    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);

    previewVideo.src = url;
    previewVideo.play();
    overlay.classList.add('active');

    // Store for sharing
    overlay.dataset.blobUrl = url;
    overlay.dataset.ext = ext;
    overlay.dataset.mime = mimeType;

    // Show/hide share button based on navigator.share support
    if (navigator.share && navigator.canShare) {
      shareBtn.style.display = '';
    } else {
      shareBtn.style.display = 'none';
    }
  }

  shareBtn.addEventListener('click', async () => {
    const url = overlay.dataset.blobUrl;
    const ext = overlay.dataset.ext;
    const mime = overlay.dataset.mime;
    const response = await fetch(url);
    const blob = await response.blob();
    const file = new File([blob], `monogrowl-visualiser.${ext}`, { type: mime });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          title: 'Monogrowl Visualiser',
          text: 'Check out this music visualiser',
          files: [file]
        });
      } catch(e) { /* user cancelled */ }
    }
  });

  downloadBtn.addEventListener('click', () => {
    const url = overlay.dataset.blobUrl;
    const ext = overlay.dataset.ext;
    const a = document.createElement('a');
    a.href = url;
    a.download = `monogrowl-visualiser.${ext}`;
    a.click();
  });

  closeShare.addEventListener('click', () => {
    overlay.classList.remove('active');
    previewVideo.pause();
    previewVideo.src = '';
    if (overlay.dataset.blobUrl) URL.revokeObjectURL(overlay.dataset.blobUrl);
  });
})();
</script>
</body>
</html>
